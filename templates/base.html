<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}Smart Attendance{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
</head>
<body>

  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand">
      <div class="brand-icon">
        <i data-lucide="scan-face"></i>
      </div>
      <span class="brand-text">FaceAttend</span>
    </div>

    <nav class="sidebar-nav">
      <a href="{{ url_for('index') }}"
         class="nav-item {% if request.endpoint == 'index' %}active{% endif %}">
        <i data-lucide="layout-dashboard"></i>
        <span>Dashboard</span>
      </a>
      <a href="{{ url_for('records_page') }}"
         class="nav-item {% if request.endpoint == 'records_page' %}active{% endif %}">
        <i data-lucide="table-2"></i>
        <span>Records</span>
      </a>
      <a href="{{ url_for('register_page') }}"
         class="nav-item {% if request.endpoint == 'register_page' %}active{% endif %}">
        <i data-lucide="user-plus"></i>
        <span>Register User</span>
      </a>
      <a href="{{ url_for('admin_dashboard') }}"
         class="nav-item {% if request.endpoint == 'admin_dashboard' %}active{% endif %}"
         style="margin-top:auto">
        <i data-lucide="shield-check"></i>
        <span>Admin</span>
      </a>
    </nav>

    <div class="sidebar-footer">
      <div class="status-indicator" id="cam-status">
        <div class="status-dot" id="status-dot"></div>
        <span id="status-text">Cam off</span>
      </div>
      <div id="engine-badge" style="margin-top:6px;font-size:10px;color:var(--text-muted);display:flex;align-items:center;gap:4px">
        <span id="engine-dot" style="width:8px;height:8px;border-radius:50%;background:var(--text-muted);display:inline-block"></span>
        <span id="engine-label">Loading…</span>
      </div>
    </div>
  </aside>

  <main class="main-content">
    <header class="topbar">
      <div class="topbar-left">
        <button class="icon-btn" id="sidebar-toggle" aria-label="Toggle sidebar">
          <i data-lucide="menu"></i>
        </button>
        <h1 class="page-title">{% block page_title %}{% endblock %}</h1>
      </div>
      <div class="topbar-right">
        <div class="clock" id="live-clock"></div>
        <div class="topbar-badge">
          <i data-lucide="calendar-days" style="width:14px;height:14px"></i>
          <span id="live-date"></span>
        </div>
      </div>
    </header>

    <div class="page-body">
      {% block content %}{% endblock %}
    </div>
  </main>

  <div id="toast-container" aria-live="polite"></div>

  <script src="{{ url_for('static', filename='js/app.js') }}"></script>
  <script>
    lucide.createIcons();

    function updateClock() {
      const now = new Date();
      document.getElementById('live-clock').textContent =
        now.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
      document.getElementById('live-date').textContent =
        now.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' });
    }
    updateClock();
    setInterval(updateClock, 1000);

    document.getElementById('sidebar-toggle').addEventListener('click', () => {
      document.getElementById('sidebar').classList.toggle('collapsed');
    });

    async function pollStatus() {
      try {
        const sr = await fetch('/api/recognition_status');
        const d  = await sr.json();

        // Camera status
        const dot  = document.getElementById('status-dot');
        const text = document.getElementById('status-text');
        if (d.running) {
          dot.classList.add('active');
          text.textContent = 'Camera on';
        } else {
          dot.classList.remove('active');
          text.textContent = 'Cam off';
        }

        // Engine badge
        const edot   = document.getElementById('engine-dot');
        const elabel = document.getElementById('engine-label');
        if (d.model_ready) {
          edot.style.background = 'var(--accent-green)';
          elabel.textContent    = d.running && d.fps ? `ArcFace ${d.fps} fps` : 'ArcFace ready';
          elabel.style.color    = 'var(--accent-green)';
        } else {
          edot.style.background = '#ef4444';
          elabel.textContent    = 'Model not ready';
          elabel.style.color    = '#ef4444';
        }
      } catch (_) {}
    }
    pollStatus();
    setInterval(pollStatus, 4000);
  </script>

  {% block extra_scripts %}{% endblock %}
</body>
</html>
